website:
  title: Analog Design Notes
  site-url: https://ds54e.github.io/analog-design-notes/
  search: false
  navbar:
    left:
      - text: Study
        href: studies/gain-operating-point-accuracy/index.qmd
      - text: 日本語
        href: ja/gain-operating-point-accuracy.qmd
      - text: Reproduce
        href: studies/gain-operating-point-accuracy/reproduce.qmd
      - text: Methods
        href: methods.qmd
  sidebar:
    style: docked
    contents:
      - href: index.qmd
        text: Research index
      - section: Gain and accuracy
        contents:
          - href: studies/gain-operating-point-accuracy/index.qmd
