      - text: Studies
        href: index.qmd
      - text: 日本語
        href: ja/finite-feedback.qmd
      - text: Reproduce
        href: studies/gain-operating-point-accuracy/reproduce.qmd
      - text: Methods
        href: methods.qmd
  sidebar:
    style: docked
    contents:
      - href: index.qmd
        text: Research index
      - section: Gain and accuracy
        contents:
          - href: studies/gain-operating-point-accuracy/index.qmd
            text: Full design guide
          - href: studies/gain-operating-point-accuracy/reproduce.qmd
            text: Evidence and reproduction
          - href: ja/gain-operating-point-accuracy.qmd
            text: 日本語の概要
      - section: Resistor uncertainty
        contents:
          - href: studies/passive-sensitivity/index.qmd
            text: Common and ratio errors
          - href: studies/passive-sensitivity/reproduce.qmd
            text: Evidence and reproduction
          - href: ja/passive-sensitivity.qmd
            text: 日本語の概要
      - section: Active area allocation
        contents:
          - href: studies/active-allocation/index.qmd
            text: Spend area on the error source
          - href: studies/active-allocation/reproduce.qmd
            text: Evidence and reproduction
          - href: ja/active-allocation.qmd
            text: 日本語の概要
      - section: Finite feedback
        contents:
          - href: studies/finite-feedback/index.qmd
            text: Error paths and input costs
          - href: studies/finite-feedback/reproduce.qmd
            text: Evidence and reproduction
          - href: ja/finite-feedback.qmd
            text: 日本語の概要
      - href: methods.qmd
        text: Methods and limits
  page-footer:
    left: "Original prose, plots and data: CC BY 4.0 · Code: MIT"
    right: "Versioned research notes · Internal AI review"

format:
  html:
    theme: default
    css: styles.css
    toc: true
    toc-depth: 2
    link-external-icon: false
    code-copy: true
    html-math-method:
      method: mathjax
      url: https://cdn.jsdelivr.net/npm/mathjax@4.1.3/tex-chtml.js
    include-in-header: revision-header.html
    include-after-body: revision-footer.html

execute:
  enabled: false
